<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 148" width="920" height="148" role="img" aria-label="Live Telemetry Sparkline Strip">
  <defs>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="920" height="148" rx="6" fill="#0B0F17" stroke="#1E293B" />

  <!-- Card 1: CPU -->
  <g transform="translate(16, 16)">
    <rect width="284" height="116" rx="4" fill="#0F172A" stroke="#1E293B" />
    <text x="14" y="24" fill="#869397" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">CLUSTER CPU LOAD</text>
    <text x="14" y="50" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="22" font-weight="700">61.4%</text>
    <circle cx="264" cy="20" r="3.5" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M 14 98 L 54 90 L 94 94 L 134 80 L 174 86 L 214 72 L 268 78 L 268 106 L 14 106 Z" fill="url(#gCyan)" />
    <path d="M 14 98 L 54 90 L 94 94 L 134 80 L 174 86 L 214 72 L 268 78" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0" dur="3.6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Card 2: Memory -->
  <g transform="translate(318, 16)">
    <rect width="284" height="116" rx="4" fill="#0F172A" stroke="#1E293B" />
    <text x="14" y="24" fill="#869397" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">MEMORY WORKING SET</text>
    <text x="14" y="50" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="22" font-weight="700">72.1%</text>
    <circle cx="264" cy="20" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <path d="M 14 92 L 54 88 L 94 85 L 134 86 L 174 80 L 214 78 L 268 74 L 268 106 L 14 106 Z" fill="url(#gEmerald)" />
    <path d="M 14 92 L 54 88 L 94 85 L 134 86 L 174 80 L 214 78 L 268 74" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Card 3: P99 Latency -->
  <g transform="translate(620, 16)">
    <rect width="284" height="116" rx="4" fill="#0F172A" stroke="#1E293B" />
    <text x="14" y="24" fill="#869397" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">P99 GATEWAY LATENCY</text>
    <text x="14" y="50" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="22" font-weight="700">14.8 ms</text>
    <circle cx="264" cy="20" r="3.5" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <path d="M 14 96 L 54 94 L 94 92 L 134 70 L 174 88 L 214 84 L 268 82 L 268 106 L 14 106 Z" fill="url(#gAmber)" />
    <path d="M 14 96 L 54 94 L 94 92 L 134 70 L 174 88 L 214 84 L 268 82" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0" dur="3.2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
