<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="titleSecPipe descSecPipe">
  <title id="titleSecPipe">Obsidian Telemetry Security &amp; RBAC Request Pipeline</title>
  <desc id="descSecPipe">Defense-in-depth pipeline showing Helmet, CORS, rate limiters, brute-force lockout, HMAC cookies, CSRF verification, RBAC roles, and audit JSONL.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgSecP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipSecP">
      <rect x="0" y="0" width="880" height="250" rx="6" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipSecP)">
    <rect width="880" height="250" fill="url(#bgSecP)" />
    <text x="24" y="30" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">SECURITY, AUTHENTICATION, CSRF &amp; RBAC ENFORCEMENT PIPELINE</text>
    <text x="24" y="48" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Zero trust boundaries · Cache-Control: no-store · Salted scrypt · Timing-safe HMAC-SHA256</text>

    <!-- Stage 1 -->
    <rect x="24" y="72" width="152" height="106" rx="5" fill="#0B1320" stroke="#06B6D4" stroke-width="1.5" />
    <text x="36" y="94" fill="#22D3EE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1. Edge Guards</text>
    <text x="36" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">Helmet headers</text>
    <text x="36" y="130" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">Strict CORS match</text>
    <text x="36" y="146" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">64kb JSON limit</text>
    <text x="36" y="162" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Forwarded IP parse</text>

    <line x1="176" y1="125" x2="198" y2="125" stroke="#06B6D4" stroke-width="1.8" />
    <polygon points="194,120 202,125 194,130" fill="#06B6D4" />

    <!-- Stage 2 -->
    <rect x="202" y="72" width="156" height="106" rx="5" fill="#0B1320" stroke="#F59E0B" stroke-width="1.5" />
    <text x="214" y="94" fill="#FCD34D" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2. Brute-Force Gate</text>
    <text x="214" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">API: 240 req / min</text>
    <text x="214" y="130" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">Auth: 30 req / 15m</text>
    <text x="214" y="146" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">5 fails -&gt; 60s 429</text>
    <text x="214" y="162" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Retry-After + Audit</text>

    <line x1="358" y1="125" x2="380" y2="125" stroke="#F59E0B" stroke-width="1.8" />
    <polygon points="376,120 384,125 376,130" fill="#F59E0B" />

    <!-- Stage 3 -->
    <rect x="384" y="72" width="156" height="106" rx="5" fill="#0B1320" stroke="#10B981" stroke-width="1.5" />
    <text x="396" y="94" fill="#4edea3" font-family="ui-monospace, monospace" font-size="11" font-weight="700">3. Auth &amp; Session</text>
    <text x="396" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">scrypt(pw) or Token</text>
    <text x="396" y="130" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">HttpOnly Cookie</text>
    <text x="396" y="146" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">SameSite=Strict</text>
    <text x="396" y="162" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">Rotates on passwd</text>

    <line x1="540" y1="125" x2="562" y2="125" stroke="#10B981" stroke-width="1.8" />
    <polygon points="558,120 566,125 558,130" fill="#10B981" />

    <!-- Stage 4 -->
    <rect x="566" y="72" width="144" height="106" rx="5" fill="#0B1320" stroke="#A855F7" stroke-width="1.5" />
    <text x="578" y="94" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">4. CSRF &amp; RBAC</text>
    <text x="578" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">X-CSRF-Token HMAC</text>
    <text x="578" y="130" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">viewer (read)</text>
    <text x="578" y="146" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">operator (mutate)</text>
    <text x="578" y="162" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">admin (/ws/exec)</text>

    <line x1="710" y1="125" x2="732" y2="125" stroke="#A855F7" stroke-width="1.8" />
    <polygon points="728,120 736,125 728,130" fill="#A855F7" />

    <!-- Stage 5 -->
    <rect x="736" y="72" width="120" height="106" rx="5" fill="#0B1320" stroke="#EF4444" stroke-width="1.5" />
    <text x="748" y="94" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">5. Audit Sink</text>
    <text x="748" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">audit.jsonl</text>
    <text x="748" y="130" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">Bearer redact</text>
    <text x="748" y="146" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">No demo muts</text>
    <text x="748" y="162" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">K8s RBAC check</text>

    <!-- Bottom status pulse -->
    <rect x="24" y="198" width="832" height="32" rx="4" fill="#0B1320" stroke="#1E293B" />
    <circle cx="42" cy="214" r="4" fill="#F59E0B">
      <animate class="ot-anim" attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="56" y="218" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Production bootstrap forbids placeholder secrets, enforces AUTH_MODE=token, and disables ENABLE_POD_EXEC by default.</text>
    <rect x="0.5" y="0.5" width="879" height="249" rx="6" fill="none" stroke="#1E293B" />
  </g>
</svg>
