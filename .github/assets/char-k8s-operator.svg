<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleK8sOp descK8sOp">
  <title id="titleK8sOp">Kubernetes Operator Character Card</title>
  <desc id="descK8sOp">Original vector operator character controlling Kubernetes nodes, PodDisruptionBudgets, and rolling restarts.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgK8s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipK8s">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipK8s)">
    <rect width="280" height="160" fill="url(#bgK8s)" />
    <!-- Rotating Control Helm -->
    <g transform="translate(222, 46)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.7" />
      <g>
        <line x1="0" y1="-26" x2="0" y2="26" stroke="#60A5FA" stroke-width="1.5" />
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#60A5FA" stroke-width="1.5" />
        <line x1="-18" y1="-18" x2="18" y2="18" stroke="#60A5FA" stroke-width="1.5" />
        <line x1="-18" y1="18" x2="18" y2="-18" stroke="#60A5FA" stroke-width="1.5" />
        <animateTransform class="ot-anim" attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite" />
      </g>
      <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5" />
    </g>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#172554" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="1.5" />
      <polygon points="32,8 50,20 50,40 32,50 14,40 14,20" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
      <rect x="20" y="23" width="24" height="10" rx="3" fill="#070A0F" stroke="#60A5FA" />
      <circle cx="26" cy="28" r="2" fill="#60A5FA" />
      <circle cx="38" cy="28" r="2" fill="#60A5FA" />
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Kubernetes Operator</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">DRAIN · SCALE · PODS</text>
    <rect x="132" y="130" width="114" height="16" rx="3" fill="#102046" stroke="#3B82F6" stroke-opacity="0.6" />
    <text x="139" y="141" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="9">PDB-GUARDED / 02</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
