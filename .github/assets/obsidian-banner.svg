<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Obsidian Telemetry Animated Banner</title>
  <desc id="bannerDesc">Header banner showing Obsidian Telemetry waveforms, hexagonal beacon, and v1.0.0 MIT open-source indicator.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#869397" fill-opacity="0.22" />
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="55%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="scanSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="960" height="240" rx="6" />
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="960" height="240" fill="url(#bgGrad)" />
    <rect width="960" height="240" fill="url(#dotGrid)" />

    <path d="M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142 L 960 240 L 0 240 Z" fill="url(#cyanWave)">
      <animate class="ot-anim" attributeName="d" dur="8s" repeatCount="indefinite"
        values="
          M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142 L 960 240 L 0 240 Z;
          M 0 172 Q 120 162 240 144 T 480 174 T 720 146 T 960 168 L 960 240 L 0 240 Z;
          M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142 L 960 240 L 0 240 Z
        " />
    </path>

    <path d="M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.8">
      <animate class="ot-anim" attributeName="d" dur="8s" repeatCount="indefinite"
        values="
          M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142;
          M 0 172 Q 120 162 240 144 T 480 174 T 720 146 T 960 168;
          M 0 185 Q 120 140 240 172 T 480 156 T 720 168 T 960 142
        " />
    </path>

    <path d="M 0 204 Q 160 190 320 198 T 640 186 T 960 195" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7">
      <animate class="ot-anim" attributeName="d" dur="6s" repeatCount="indefinite"
        values="
          M 0 204 Q 160 190 320 198 T 640 186 T 960 195;
          M 0 196 Q 160 208 320 184 T 640 202 T 960 186;
          M 0 204 Q 160 190 320 198 T 640 186 T 960 195
        " />
    </path>

    <rect class="ot-anim" x="-120" y="0" width="120" height="240" fill="url(#scanSweep)">
      <animate attributeName="x" from="-120" to="960" dur="5.5s" repeatCount="indefinite" />
    </rect>

    <g transform="translate(88, 108)">
      <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
      <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="#4cd7f6" stroke-width="1" stroke-opacity="0.55">
        <animateTransform class="ot-anim" attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite" />
      </polygon>
      <circle cx="0" cy="0" r="8" fill="#22D3EE">
        <animate class="ot-anim" attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite" />
        <animate class="ot-anim" attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="156" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8">
      OBSIDIAN TELEMETRY
    </text>
    <text x="158" y="132" fill="#bcc9cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="0.4">
      SELF-HOSTED KUBERNETES &amp; PROMETHEUS OBSERVABILITY PLATFORM
    </text>

    <g transform="translate(718, 32)">
      <rect x="0" y="0" width="210" height="28" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="16" cy="14" r="4" fill="#10B981">
        <animate class="ot-anim" attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#4edea3" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.8">
        MIT OPEN SOURCE · v1.0.0
      </text>
    </g>

    <rect x="0.5" y="0.5" width="959" height="239" rx="6" fill="none" stroke="#1E293B" />
  </g>
</svg>
