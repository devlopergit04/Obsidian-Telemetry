<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleNetArch descNetArch">
  <title id="titleNetArch">Network Architect Character Card</title>
  <desc id="descNetArch">Original vector character mapping Kubernetes Services, Ingress routes, and WebSocket transport boundaries.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgNet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipNet">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipNet)">
    <rect width="280" height="160" fill="url(#bgNet)" />
    <!-- Topology Mesh -->
    <g stroke="#06B6D4" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="170" y1="30" x2="215" y2="54" />
      <line x1="215" y1="54" x2="254" y2="28" />
      <line x1="215" y1="54" x2="246" y2="70" />
    </g>
    <circle cx="170" cy="30" r="4" fill="#22D3EE" />
    <circle cx="215" cy="54" r="5" fill="#10B981" />
    <circle cx="254" cy="28" r="4" fill="#22D3EE" />
    <circle cx="246" cy="70" r="4" fill="#A855F7" />
    <circle cx="170" cy="30" r="2.5" fill="#dfe2ee">
      <animateMotion class="ot-anim" dur="2.6s" repeatCount="indefinite" path="M0,0 L45,24 L84,-2" />
    </circle>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#1A1633" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1.5" />
      <circle cx="32" cy="30" r="17" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
      <polygon points="18,26 46,26 42,36 22,36" fill="#070A0F" stroke="#C084FC" stroke-width="1.2" />
      <circle cx="27" cy="31" r="2" fill="#22D3EE" />
      <circle cx="37" cy="31" r="2" fill="#22D3EE" />
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Network Architect</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">INGRESS · WS · CORS</text>
    <rect x="132" y="130" width="112" height="16" rx="3" fill="#231438" stroke="#A855F7" stroke-opacity="0.55" />
    <text x="139" y="141" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="9">ROUTING GRAPH / 04</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
