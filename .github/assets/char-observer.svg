<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleObserver descObserver">
  <title id="titleObserver">Monitoring Observer Character Card</title>
  <desc id="descObserver">Original vector character analyzing Prometheus PromQL time-series telemetry and alert rules.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgObs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipObs">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipObs)">
    <rect width="280" height="160" fill="url(#bgObs)" />
    <!-- Live Waveform Display -->
    <rect x="142" y="22" width="118" height="54" rx="4" fill="#070A0F" stroke="#1E293B" />
    <polyline points="150,58 164,52 178,60 192,38 206,48 220,34 234,44 250,36" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round" />
    <circle cx="250" cy="36" r="3" fill="#F59E0B">
      <animate class="ot-anim" attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" />
      <circle cx="32" cy="30" r="17" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <!-- Dual Lens Goggles -->
      <circle cx="24" cy="29" r="6" fill="#070A0F" stroke="#22D3EE" stroke-width="1.5" />
      <circle cx="40" cy="29" r="6" fill="#070A0F" stroke="#22D3EE" stroke-width="1.5" />
      <line x1="30" y1="29" x2="34" y2="29" stroke="#22D3EE" stroke-width="1.5" />
      <circle cx="24" cy="29" r="2" fill="#22D3EE" />
      <circle cx="40" cy="29" r="2" fill="#F59E0B" />
      <!-- Telemetry Tablet -->
      <rect x="46" y="52" width="18" height="22" rx="2" fill="#0B192C" stroke="#22D3EE" stroke-width="1.2" />
      <line x1="50" y1="60" x2="60" y2="60" stroke="#10B981" stroke-width="1.5" />
      <line x1="50" y1="66" x2="57" y2="66" stroke="#22D3EE" stroke-width="1.5" />
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Monitoring Observer</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">PROMQL · INCIDENTS</text>
    <rect x="132" y="130" width="108" height="16" rx="3" fill="#0B192C" stroke="#22D3EE" stroke-opacity="0.5" />
    <text x="139" y="141" fill="#22D3EE" font-family="ui-monospace, monospace" font-size="9">P99 / ALERTS / 05</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
