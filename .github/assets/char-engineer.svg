<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleEngineer descEngineer">
  <title id="titleEngineer">Server Engineer Character Card</title>
  <desc id="descEngineer">Original vector character tuning Express middleware, port 1392 sockets, and cross-platform CLI processes.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgEng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipEng">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipEng)">
    <rect width="280" height="160" fill="url(#bgEng)" />
    <!-- Background Server Rack Bars -->
    <g transform="translate(182, 22)" opacity="0.85">
      <rect x="0" y="0" width="76" height="14" rx="2" fill="#0F172A" stroke="#1E293B" />
      <circle cx="10" cy="7" r="2.5" fill="#10B981">
        <animate class="ot-anim" attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <rect x="20" y="5" width="42" height="4" rx="1" fill="#334155" />
      <rect x="0" y="20" width="76" height="14" rx="2" fill="#0F172A" stroke="#1E293B" />
      <circle cx="10" cy="27" r="2.5" fill="#06B6D4" />
      <rect x="20" y="25" width="32" height="4" rx="1" fill="#334155" />
      <rect x="0" y="40" width="76" height="14" rx="2" fill="#0F172A" stroke="#1E293B" />
      <circle cx="10" cy="47" r="2.5" fill="#10B981" />
      <rect x="20" y="45" width="48" height="4" rx="1" fill="#06B6D4" fill-opacity="0.5" />
    </g>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#13262F" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" />
      <circle cx="32" cy="30" r="17" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <!-- Headset / Band -->
      <path d="M 14 28 A 18 18 0 0 1 50 28" fill="none" stroke="#10B981" stroke-width="2.5" />
      <rect x="11" y="24" width="5" height="10" rx="2" fill="#10B981" />
      <rect x="48" y="24" width="5" height="10" rx="2" fill="#10B981" />
      <!-- Eyes -->
      <rect x="20" y="25" width="24" height="9" rx="4" fill="#070A0F" stroke="#334155" />
      <rect x="24" y="28" width="5" height="3" rx="1" fill="#4edea3" />
      <rect x="35" y="28" width="5" height="3" rx="1" fill="#4edea3" />
      <!-- Wrench Gear -->
      <circle cx="58" cy="64" r="7" fill="none" stroke="#4edea3" stroke-width="2" stroke-dasharray="4 3">
        <animateTransform class="ot-anim" attributeName="transform" type="rotate" from="0 58 64" to="360 58 64" dur="6s" repeatCount="indefinite" />
      </circle>
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Server Engineer</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">EXPRESS · CLI DAEMON</text>
    <rect x="132" y="130" width="112" height="16" rx="3" fill="#0B221C" stroke="#10B981" stroke-opacity="0.5" />
    <text x="139" y="141" fill="#4edea3" font-family="ui-monospace, monospace" font-size="9">0.0.0.0:1392</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
