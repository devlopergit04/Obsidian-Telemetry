<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-label="Obsidian Telemetry System Architecture">
  <rect width="920" height="220" rx="6" fill="#070A0F" stroke="#1E293B" />

  <!-- Column 1: Multi-Cluster State -->
  <g transform="translate(28, 34)">
    <rect width="190" height="152" rx="4" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.6" />
    <text x="14" y="24" fill="#4cd7f6" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CLUSTER STATE</text>
    <rect x="14" y="38" width="162" height="26" rx="3" fill="#1E293B" />
    <text x="24" y="55" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">us-east-prod-01</text>
    <rect x="14" y="72" width="162" height="26" rx="3" fill="#111827" stroke="#1E293B" />
    <text x="24" y="89" fill="#bcc9cd" font-family="ui-monospace, monospace" font-size="11">eu-central-k8s-02</text>
    <rect x="14" y="106" width="162" height="26" rx="3" fill="#111827" stroke="#1E293B" />
    <text x="24" y="123" fill="#bcc9cd" font-family="ui-monospace, monospace" font-size="11">ap-south-edge-04</text>
  </g>

  <!-- Animated Flow Connector 1 -> 2 -->
  <line x1="218" y1="110" x2="296" y2="110" stroke="#06B6D4" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite" />
  </line>
  <circle cx="257" cy="110" r="3.5" fill="#22D3EE">
    <animate attributeName="cx" from="224" to="290" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Column 2: Core Screens -->
  <g transform="translate(296, 22)">
    <rect width="328" height="176" rx="4" fill="#0F172A" stroke="#1E293B" />
    <text x="16" y="24" fill="#4cd7f6" font-family="ui-monospace, monospace" font-size="11" font-weight="700">OBSERVABILITY VIEWS (5 SCREENS)</text>

    <rect x="16" y="38" width="142" height="36" rx="3" fill="#111827" stroke="#334155" />
    <text x="26" y="60" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">01. Overview</text>

    <rect x="170" y="38" width="142" height="36" rx="3" fill="#111827" stroke="#334155" />
    <text x="180" y="60" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">02. Nodes/Pods</text>

    <rect x="16" y="84" width="142" height="36" rx="3" fill="#111827" stroke="#334155" />
    <text x="26" y="106" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">03. Live Logs</text>

    <rect x="170" y="84" width="142" height="36" rx="3" fill="#111827" stroke="#334155" />
    <text x="180" y="106" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">04. Mesh/Net</text>

    <rect x="16" y="130" width="296" height="32" rx="3" fill="#111827" stroke="#334155" />
    <text x="26" y="150" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">05. Incidents &amp; PromQL Rule Engine</text>
  </g>

  <!-- Animated Flow Connector 2 -> 3 -->
  <line x1="624" y1="110" x2="702" y2="110" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite" />
  </line>
  <circle cx="663" cy="110" r="3.5" fill="#4edea3">
    <animate attributeName="cx" from="630" to="696" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Column 3: Inspector & Exec Console -->
  <g transform="translate(702, 34)">
    <rect width="190" height="152" rx="4" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" />
    <text x="14" y="24" fill="#4edea3" font-family="ui-monospace, monospace" font-size="11" font-weight="700">360px INSPECTOR</text>
    <text x="14" y="50" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">- Cordon / Drain</text>
    <text x="14" y="72" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">- Pod Restart</text>
    <text x="14" y="94" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">- Node Exec Shell</text>
    <text x="14" y="116" fill="#dfe2ee" font-family="ui-monospace, monospace" font-size="11">- Runbook Triage</text>
    <text x="14" y="138" fill="#869397" font-family="ui-monospace, monospace" font-size="10">localStorage Sync</text>
  </g>
</svg>
