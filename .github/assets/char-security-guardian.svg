<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleSecGuard descSecGuard">
  <title id="titleSecGuard">Security Guardian Character Card</title>
  <desc id="descSecGuard">Original vector guardian character enforcing HMAC cookies, CSRF tokens, RBAC, and brute-force lockouts.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgSec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipSec">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipSec)">
    <rect width="280" height="160" fill="url(#bgSec)" />
    <!-- Security Shield -->
    <g transform="translate(222, 46)">
      <path d="M 0 -24 L 22 -14 L 22 6 C 22 20 0 28 0 28 C 0 28 -22 20 -22 6 L -22 -14 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8" />
      <path d="M -7 2 L -2 7 L 9 -5" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="-24" r="2.5" fill="#F59E0B">
        <animate class="ot-anim" attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#2A1D0D" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.5" />
      <circle cx="32" cy="30" r="17" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <rect x="20" y="24" width="24" height="9" rx="4" fill="#070A0F" stroke="#F59E0B" />
      <circle cx="26" cy="28.5" r="2" fill="#FBBF24" />
      <circle cx="38" cy="28.5" r="2" fill="#FBBF24" />
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Security Guardian</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">RBAC · CSRF · SCRYPT</text>
    <rect x="132" y="130" width="114" height="16" rx="3" fill="#271B09" stroke="#F59E0B" stroke-opacity="0.55" />
    <text x="139" y="141" fill="#FCD34D" font-family="ui-monospace, monospace" font-size="9">HMAC / AUDIT / 06</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
