<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-labelledby="titleDataCaretaker descDataCaretaker">
  <title id="titleDataCaretaker">Data Caretaker Character Card</title>
  <desc id="descDataCaretaker">Original vector character safeguarding atomic JSON persistence, .bak crash recovery, log rotation, and SHA-256 backups.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .ot-anim { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bgData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <clipPath id="clipData">
      <rect x="0" y="0" width="280" height="160" rx="8" />
    </clipPath>
  </defs>
  <g clip-path="url(#clipData)">
    <rect width="280" height="160" fill="url(#bgData)" />
    <!-- Stacked Storage Cylinders -->
    <g transform="translate(194, 24)">
      <ellipse cx="28" cy="8" rx="22" ry="6" fill="#0B221C" stroke="#10B981" stroke-width="1.3" />
      <path d="M 6 8 L 6 24 C 6 28 50 28 50 24 L 50 8" fill="#0F172A" stroke="#10B981" stroke-width="1.3" />
      <path d="M 6 26 L 6 42 C 6 46 50 46 50 42 L 50 26" fill="#0F172A" stroke="#06B6D4" stroke-width="1.3" />
      <circle cx="42" cy="18" r="2" fill="#4edea3">
        <animate class="ot-anim" attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>
    <!-- Character Figure -->
    <g transform="translate(50, 42)">
      <path d="M 10 88 L 16 54 Q 32 48 48 54 L 54 88 Z" fill="#0F2924" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" />
      <circle cx="32" cy="30" r="17" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <rect x="20" y="24" width="24" height="9" rx="3" fill="#070A0F" stroke="#10B981" />
      <circle cx="26" cy="28.5" r="2" fill="#4edea3" />
      <circle cx="38" cy="28.5" r="2" fill="#4edea3" />
    </g>
    <text x="132" y="102" fill="#dfe2ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Data Caretaker</text>
    <text x="132" y="119" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">ATOMIC · SHA-256</text>
    <rect x="132" y="130" width="114" height="16" rx="3" fill="#0B221C" stroke="#10B981" stroke-opacity="0.55" />
    <text x="139" y="141" fill="#4edea3" font-family="ui-monospace, monospace" font-size="9">ot backup / restore</text>
    <rect x="0.5" y="0.5" width="279" height="159" rx="8" fill="none" stroke="#1E293B" />
  </g>
</svg>
