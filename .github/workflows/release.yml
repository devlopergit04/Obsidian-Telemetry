name: Release Verification & Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-package:
    name: Build, Verify & Package Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run format, types, lint, and tests
        run: |
          npm run format:check
          npm run lint
          npm run lint:code
          npm test

      - name: Build production bundles and create tarball
        run: |
          npm run build
          npm pack
          TARBALL="$(ls -1 obsidian-telemetry-*.tgz | head -n1)"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-telemetry-tarball
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          generate_release_notes: true

      # Maintainer note: After configuring npm Trusted Publishing (OIDC) or NPM_TOKEN secret,
      # uncomment or add a dedicated publish job running `npm publish --provenance --access public`.
