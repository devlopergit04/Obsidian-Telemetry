# Default least-privilege read-only Kubernetes RBAC for Obsidian Telemetry.
# Apply this manifest for cluster observability without write/mutation permissions.
# To allow node cordon/drain, pod deletion, or deployment scaling, ALSO apply rbac-operator.yaml explicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-telemetry
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obsidian-telemetry-viewer
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - services
      - events
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - ingresses
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['policy']
    resources:
      - poddisruptionbudgets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources:
      - nodes
      - pods
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obsidian-telemetry-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obsidian-telemetry-viewer
subjects:
  - kind: ServiceAccount
    name: obsidian-telemetry
    namespace: observability
