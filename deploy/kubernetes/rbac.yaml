apiVersion: v1
kind: ServiceAccount
metadata:
  name: obsidian-telemetry
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obsidian-telemetry-operator
rules:
  # Read-only cluster & workload inspection
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - services
      - events
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources:
      - ingresses
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['policy']
    resources:
      - poddisruptionbudgets
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources:
      - nodes
      - pods
    verbs: ['get', 'list']
  # Explicit scoped operational permissions (never cluster-admin)
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['patch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['delete']
  - apiGroups: ['']
    resources: ['pods/eviction']
    verbs: ['create']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['patch']
  - apiGroups: ['apps']
    resources: ['deployments/scale']
    verbs: ['get', 'patch', 'update']
  # Optional: uncomment ONLY if ENABLE_POD_EXEC=true is intentionally enabled
  # - apiGroups: ['']
  #   resources: ['pods/exec']
  #   verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obsidian-telemetry-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obsidian-telemetry-operator
subjects:
  - kind: ServiceAccount
    name: obsidian-telemetry
    namespace: observability
