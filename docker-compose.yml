services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obsidian-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    restart: unless-stopped

  obsidian-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-telemetry
    ports:
      - '1392:1392'
    environment:
      NODE_ENV: production
      OT_HOST: 0.0.0.0
      OT_PORT: 1392
      OT_HOME: /var/lib/obsidian-telemetry
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:1392}
      AUTH_MODE: token
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ random chars) in .env before starting Docker Compose}
      OT_ADMIN_PASSWORD: ${OT_ADMIN_PASSWORD:-}
      OBSIDIAN_ADMIN_TOKEN: ${OBSIDIAN_ADMIN_TOKEN:-}
      OBSIDIAN_OPERATOR_TOKEN: ${OBSIDIAN_OPERATOR_TOKEN:-}
      OBSIDIAN_VIEWER_TOKEN: ${OBSIDIAN_VIEWER_TOKEN:-}
      KUBE_MODE: ${KUBE_MODE:-disabled}
      KUBECONFIG_PATH: /home/obsidian/.kube/config
      PROMETHEUS_URL: http://prometheus:9090
      ENABLE_POD_EXEC: 'false'
      ENABLE_DEMO_MODE: 'true'
    volumes:
      - obsidian_state:/var/lib/obsidian-telemetry
      # Mount your local kubeconfig read-only and set KUBE_MODE=kubeconfig when connecting to an external cluster:
      # - ${HOME}/.kube/config:/home/obsidian/.kube/config:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  obsidian_state:
